# Cloudflare Worker — overhype.me OG router.
#
# Intercepts GET /m/:slug. When the request comes from a known crawler UA,
# the worker fetches /api/og/m/:slug from the same origin and returns the
# crawler-targeted HTML shell. Human visitors are passed through to the
# default origin (the static SPA artifact) unchanged.
#
# Deploy:
#   Deploy the main app FIRST and confirm it's live (curl -I a meme image URL,
#   check the ETag reads meme-v<N>-... matching MEME_IMAGE_EDGE_CACHE_VERSION
#   in src/index.ts) — THEN:
#   pnpm worker:deploy
# (which runs `wrangler deploy` against this config)
# Deploying this Worker before the origin has the matching version lets the
# edge cache the OLD bytes under the NEW cache key for a full s-maxage,
# defeating the version bump. See README.md's Deploy section.
#
# Required env (set as Cloudflare Workers secret or in this repo's .env
# loaded by the deploy script):
#   CLOUDFLARE_API_TOKEN  Token with "Edit Cloudflare Workers" scope.

name = "overhype-og-router"
main = "src/index.ts"
compatibility_date = "2025-01-15"
account_id = "975a348dc75f2f3849507caefab3862e"

# Bind the worker to:
#   /m/*               → bot-vs-human OG shell routing
#   /api/memes/*/image → strip GAESA Set-Cookie injected by GCP so Twitter
#                        can large-card the image (CF would otherwise mark
#                        the response private and refuse to cache it)
#   /api/og/*          → same cookie strip for the OG shell endpoint, so
#                        the shell itself is edge-cacheable
# The zone must be on the same Cloudflare account and the matching DNS
# records must be proxied (orange-cloud) for the routes to fire.
routes = [
  { pattern = "overhype.me/m/*",          zone_id = "759edc0f6744c981b16d648f1a9ffa12" },
  { pattern = "overhype.me/api/memes/*",  zone_id = "759edc0f6744c981b16d648f1a9ffa12" },
  { pattern = "overhype.me/api/og/*",     zone_id = "759edc0f6744c981b16d648f1a9ffa12" },
]

# Smaller bundle, faster cold starts.
minify = true

[observability]
enabled = true
