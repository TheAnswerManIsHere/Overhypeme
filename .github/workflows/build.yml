name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    # Explicit least-privilege. `pull-requests: read` is what the loop-ledger
    # coverage guard needs to list closed PRs; every other step in this job
    # only reads the checkout.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Static, dependency-free gate: fail fast if the agent-context docs cite a
      # repo path or link that no longer exists (keeps docs/ai-context true).
      - name: Check docs accuracy (links + cited paths)
        run: node scripts/check-docs-accuracy.mjs

      # Also dependency-free. The loop ledger's whole premise is that counted
      # numbers beat recalled ones, so its counting logic has to be provably
      # right — an unverified derivation would carry exactly the false
      # authority it exists to remove.
      - name: Check loop-metrics derivation
        run: node --test scripts/__tests__/loop-metrics.test.mjs

      - name: Check ledger-coverage guard logic
        run: node --test scripts/__tests__/check-ledger-coverage.test.mjs

      # The ledger only answers questions if the rows are actually in it. On
      # 2026-07-29 it held 2 rows against 13 closed loops — the obligation had
      # nowhere to fail, so it was skipped silently while CI stayed green.
      # This makes a missing row a red check instead of a memory problem.
      # PR_NUMBER is empty on push-to-main, where the coverage half is skipped
      # (a just-merged loop's row belongs to the NEXT PR, not to itself) and
      # only the offline arithmetic check runs.
      - name: Check loop-ledger coverage
        run: node scripts/check-ledger-coverage.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate migration snapshots
        run: pnpm --filter @workspace/db validate-snapshots

      # Guard against hand-edits to codegen-owned files (known-failure-patterns.md
      # → "Manual api-zod/src/index.ts export silently reverted by codegen").
      # Same script as the local ritual: rerun codegen, fail on any diff.
      - name: Codegen drift check
        run: pnpm run check:codegen-drift

      - name: Build app
        run: pnpm run build
        env:
          PORT: "8081"
          BASE_PATH: "/__mockup"

  # Authoritative test gate: runs the api-server integration suite against a real
  # Postgres + pgvector. Phase 2's runner does all DB setup; CI just provides the
  # database. Runs in parallel with `build` (no `needs:`) for fast feedback.
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: overhype
          POSTGRES_PASSWORD: overhype
          POSTGRES_DB: overhype_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U overhype -d overhype_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # overhype_test is a name the runner's production guard allows (it refuses
      # `heliumdb`, the prod/dev DB name). The `overhype` role is a superuser
      # (postgres image default), so the runner uses its fast per-worker-DB mode.
      DATABASE_URL: postgres://overhype:overhype@localhost:5432/overhype_test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Node 22 (not 20): the test runner passes a glob (src/__tests__/**/*.test.ts)
      # to `node --test`, which only expands globs on Node 21+. Node 20 finds 0
      # files (and lacks the test-isolation flag). 22 matches where these tests
      # are verified to run (Replit is on Node 24).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pg_dump/psql must be >= the pg16 server the runner clones schemas from.
      # Put the v16 bin dir first on PATH so they resolve to v16 even if an older
      # client also exists on the runner.
      - name: Install PostgreSQL client 16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/psql --version
          /usr/lib/postgresql/16/bin/pg_dump --version

      # Fail early and clearly if the service/credentials are wrong, and create the
      # pgvector extension before push-force (the schema has vector columns).
      - name: Prepare database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'SELECT current_database(), current_user;'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT extname FROM pg_extension WHERE extname = 'vector';"

      - name: Show runner diagnostics
        run: |
          echo "nproc=$(nproc)"
          node --version
          pnpm --version

      # @workspace/db's own suite (migrate.test.ts, ncmecAuditBoundaryStatus.test.ts) was
      # previously unreachable from any CI gate — Build only compiles the libraries and this
      # job ran api-server's suite alone, so a regression in lib/db's own tests (including the
      # restricted-role privilege-boundary assertions) could fail locally and stay green here.
      # Applied directly against this job's `public` schema before the api-server suite forks
      # off its own per-shard databases from it.
      - name: Apply schema + migrations for @workspace/db test suite
        run: |
          pnpm --filter @workspace/db push-force
          pnpm --filter @workspace/db run migrate

      - name: Run @workspace/db test suite
        run: pnpm --filter @workspace/db test

      # `pretest` applies push-force + migrations + codegen; run-tests-sharded.sh
      # then clones an isolated database per shard (auto-selected min(nproc,4)).
      - name: Run api-server test suite
        run: pnpm --filter @workspace/api-server test

  # Frontend unit suite (vitest, jsdom — no server or DB needed). Runs in
  # parallel with build/test for fast feedback. Before this job existed, only
  # the backend suite gated PRs and a frontend regression rode through green CI.
  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run overhype-me vitest suite
        run: pnpm --filter @workspace/overhype-me test

  # Route-load smoke (Playwright) — the regression net for the crash/reload-loop
  # bug class (known-failure-patterns.md → "Self-retriggering recovery with no
  # bounded exit"). Boots the REAL dev stack — api-server + Vite dev server —
  # because the bug class lives in dev-server/lazy-chunk behavior that neither
  # unit tests nor a production build exercise. Outside Replit there is no
  # platform path-router splitting /api from the SPA, so the Vite config's
  # env-gated E2E_API_PROXY_TARGET proxy plays that role here.
  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: overhype
          POSTGRES_PASSWORD: overhype
          POSTGRES_DB: overhype_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U overhype -d overhype_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://overhype:overhype@localhost:5432/overhype_test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ~170MB Chromium download — cache it like setup-node caches the pnpm
      # store. On a hit the install step is skipped entirely (the ubuntu-24.04
      # image already ships the browser's shared-library deps; --with-deps
      # below only matters on the cache-miss path).
      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @workspace/overhype-me exec playwright install --with-deps chromium

      - name: Apply schema + migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          pnpm --filter @workspace/db push-force
          pnpm --filter @workspace/db run migrate

      # The smoke spec authenticates via POST /api/auth/dev-admin-login, which
      # looks up the bootstrap admin account. The seed script imports the
      # canonical BOOTSTRAP_ADMIN_EMAIL so CI can't drift from the route.
      - name: Seed admin user
        run: pnpm --filter @workspace/api-server exec tsx scripts/seed-dev-admin.ts

      # Real dev entrypoints, minus the supervisor wrapper (a crash should fail
      # CI, not restart). Both servers boot concurrently; the health polls run
      # after both launches so total wait is max(boot times), not the sum.
      # ENABLE_DEV_ADMIN_LOGIN is safe here for the same reason as dev-run.sh:
      # isDevAdminLoginEnabled() is fail-closed and this is an ephemeral CI
      # database. Vite's /api proxy defaults to localhost:8080 off-Replit
      # (vite.config.ts), standing in for Replit's path router.
      - name: Start dev stack (api-server + Vite)
        run: |
          (cd artifacts/api-server && PORT=8080 NODE_ENV=development ENABLE_DEV_ADMIN_LOGIN=true CRON_SECRET=ci-smoke-dummy \
            pnpm exec tsx src/index.ts > /tmp/api-server.log 2>&1 &)
          (cd artifacts/overhype-me && PORT=5173 BASE_PATH=/ \
            pnpm exec vite > /tmp/vite.log 2>&1 &)
          wait_for_url() {
            timeout 90 bash -c "until curl -sf $1 > /dev/null; do sleep 2; done" \
              || { echo "::error::$2 never became healthy"; tail -50 "$3"; exit 1; }
          }
          wait_for_url http://localhost:8080/api/config api-server /tmp/api-server.log
          wait_for_url http://localhost:5173/ "Vite-dev-server" /tmp/vite.log

      - name: Run route-load smoke suite
        run: E2E_BASE_URL=http://localhost:5173 pnpm --filter @workspace/overhype-me run e2e:smoke

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-traces
          path: |
            artifacts/overhype-me/test-results/
            /tmp/api-server.log
            /tmp/vite.log
          retention-days: 7
          if-no-files-found: ignore
