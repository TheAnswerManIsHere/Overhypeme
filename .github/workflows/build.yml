name: Build

on:
  # `edited` is explicit, not just the GitHub default (opened/synchronize/
  # reopened): retitling a PR to `[LEDGER] …` after its last push must
  # re-run the ledger-coverage step's structural gate against the new
  # title, or a stale green check from before the retitle would stay
  # attached to the commit. check-ledger-coverage.mjs's
  # confirmedLedgerPrNumbers is the primary defense (it re-validates any
  # [LEDGER]-titled PR's live files rather than trusting title alone), but
  # re-triggering here means the PR's own check reflects reality
  # immediately instead of only the next PR's or the push-to-main audit's
  # re-check.
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
  push:
    branches:
      - main

# A PR-triggered run is obsolete the moment another push lands on the same
# PR — cancelling it loses no signal, just wall-clock and Actions minutes.
# Every push-to-main run must complete, no exceptions — the ledger-debt
# audit step only runs there. That ruled out `queue: max` (GitHub disallows
# combining it with a `cancel-in-progress` that can evaluate true, which
# ours does for PR events) as a way to protect queued push runs. Falling
# back to `github.ref` for the group key was tried first and was WRONG: every
# push-to-main run shares that same ref, so a burst of quick merges would
# still hit GitHub's default single-pending-slot behavior and silently drop
# a queued run — cancel-in-progress: false only protects a run already
# EXECUTING, not one waiting behind it. Falling back to `github.run_id`
# instead (unique per run) means push/schedule runs never share a group
# with each other at all, so nothing is ever queued or cancelled for them —
# only same-PR runs share a group and race for cancellation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Classifies the change set so the heavy jobs (Test, Frontend Test,
  # E2E Smoke) can skip docs-only PRs — /document harvests, [LEDGER] PRs,
  # UAT/TEST_RUN docs, skill and CLAUDE.md edits — which provably cannot
  # change those suites' outcomes. The Build job is NOT gated: it carries
  # the docs-accuracy, ledger, and script-test gates that docs PRs exist to
  # exercise.
  #
  # The skip happens via job-level `if:` on the jobs below, deliberately NOT
  # via workflow-level `paths:`/`paths-ignore:` filtering. A required check
  # whose workflow never triggers reports nothing, leaving the PR stuck at
  # "Expected — waiting for status to be reported" forever. A job skipped by
  # `if:` instead reports "Success" — GitHub's documented behavior: "A job
  # that is skipped will report its status as 'Success'. It will not prevent
  # a pull request from merging, even if it is a required check."
  #
  # Every failure path lands on "run everything": push-to-main skips the
  # classification entirely (main is the backstop — always full coverage), a
  # failed file-listing API call yields an empty list which classifies as
  # heavy, a file list whose entry count disagrees with the PR's own
  # changed_files total (the API hard-caps at 3,000 files) forces heavy, and
  # if this job itself fails outright, the gated jobs' `!cancelled()` +
  # `needs.changes.result != 'success'` condition runs them anyway — a plain
  # `needs` would have SKIPPED them on failure, and a skipped required check
  # reports success, which is exactly the silent green this design must
  # never produce.
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run-heavy: ${{ steps.classify.outputs.run-heavy }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # The PR's full changed-file list (all commits, not just the latest
      # push) via the API — same semantics GitHub's own paths filters use
      # for pull_request events, so a PR that touched code in commit 1 and
      # docs in commit 11 still runs the full suite on every push. Runner's
      # preinstalled node is fine: the classifier is dependency-free.
      #
      # Both sides of a rename are classified: a product file renamed INTO
      # docs/ deletes its heavy source path, and judging only the
      # destination would let that deletion skip the suites. And because the
      # files API hard-caps at 3,000 entries, the collected entry count is
      # checked against the PR's own changed_files total — any mismatch
      # (truncation, API weirdness) forces the full suite rather than
      # classifying a prefix as if it were the whole change set.
      - name: Classify
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run-heavy=true" >> "$GITHUB_OUTPUT"
            echo "push/schedule event — full suite unconditionally."
            exit 0
          fi
          raw=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[] | [.filename, (.previous_filename // "")] | @tsv') || raw=""
          entry_count=$(printf '%s' "$raw" | grep -c '^' || true)
          expected='${{ github.event.pull_request.changed_files }}'
          if [ -z "$raw" ] || [ "$entry_count" != "$expected" ]; then
            echo "run-heavy=true" >> "$GITHUB_OUTPUT"
            echo "collected $entry_count file entr(ies) but the PR reports $expected changed file(s) — treating as unreadable, full suite."
            exit 0
          fi
          result=$(printf '%s\n' "$raw" | tr '\t' '\n' | grep -v '^$' | node scripts/classify-ci-paths.mjs) \
            || result="run-heavy=true"
          echo "$result" >> "$GITHUB_OUTPUT"
          echo "$result"

  build:
    name: Build
    runs-on: ubuntu-latest

    # Explicit least-privilege. `pull-requests: read` is what the loop-ledger
    # coverage guard needs to list closed PRs; every other step in this job
    # only reads the checkout.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Static, dependency-free gate: fail fast if the agent-context docs cite a
      # repo path or link that no longer exists (keeps docs/ai-context true).
      - name: Check docs accuracy (links + cited paths)
        run: node scripts/check-docs-accuracy.mjs

      # The manual's charter reserves configuration — values and their prose
      # stand-ins — for docs/ai-context/. That rule was written after a de-fork
      # PR spent three review rounds on the boundary, then took three MORE
      # because each round surfaced another phrase that failed it while the
      # previous one was being fixed. Every one of those was lexically
      # detectable, so per docs/ai-context/decisions.md ("Recurring failure
      # patterns become CI guards, not just doc updates") this is a check
      # rather than a seventh promise to be careful.
      # LEXICAL ONLY — it cannot see duplicated facts or false claims.
      - name: Check manual tuning language
        run: node scripts/check-manual-tuning-language.mjs

      - name: Check manual tuning-language guard logic
        run: node --test scripts/__tests__/check-manual-tuning-language.test.mjs

      # Also dependency-free. The loop ledger's whole premise is that counted
      # numbers beat recalled ones, so its counting logic has to be provably
      # right — an unverified derivation would carry exactly the false
      # authority it exists to remove.
      - name: Check loop-metrics derivation
        run: node --test scripts/__tests__/loop-metrics.test.mjs

      - name: Check ledger-coverage guard logic
        run: node --test scripts/__tests__/check-ledger-coverage.test.mjs

      # The workstream board is only trustworthy if its columns match reality.
      # The label -> field mapping is the one place that can quietly drift (a
      # renamed Status option, a new stage with no label slug), and a board that
      # stops tracking reads identically to a board where nothing needs David.
      - name: Check project-sync label mapping
        run: node --test scripts/__tests__/sync-project-fields.test.mjs

      # A workstream stuck at stage:test-run after Replit actually finished is
      # invisible in exactly the way the whole board exists to prevent — this
      # script is the only writable trigger for that transition, so its
      # filename parsing, UAT-doc detection, and label/body rewrites need to
      # be provably right, not just plausible.
      - name: Check TEST_RUN completion sync logic
        run: node --test scripts/__tests__/sync-test-run-completion.test.mjs

      # The classifier decides which PRs get to skip the Test/Frontend
      # Test/E2E Smoke jobs entirely. A bug in its allowlist is the one way
      # this workflow could silently wave a code change past the suites, so
      # its inert/heavy matrix is asserted here — in the always-on job, which
      # is exactly the job a misclassified PR can't skip.
      - name: Check CI path classifier logic
        run: node --test scripts/__tests__/classify-ci-paths.test.mjs

      # The Bash guard decides which git commands this session may run. Its
      # previous version blocked `git push --force` and allowed `git push -f`,
      # so the one thing it existed to prevent was the one thing it let past —
      # and nothing tested it, so the hole survived however long it was there.
      # A guard whose block/allow matrix is unasserted is a guard nobody can
      # rely on, which is worse than none: it is trusted.
      - name: Check Bash guard decisions
        run: node --test scripts/__tests__/guard-decision.test.mjs

      # The ledger only answers questions if the rows are actually in it. On
      # 2026-07-29 it held 2 rows against 13 closed loops — the obligation had
      # nowhere to fail, so it was skipped silently while CI stayed green.
      # This makes a missing row a red check instead of a memory problem.
      # PR_NUMBER is empty on push-to-main, where the coverage half is skipped
      # (a just-merged loop's row belongs to the NEXT PR, not to itself) and
      # only the offline arithmetic check runs.
      - name: Check loop-ledger coverage
        if: github.event_name == 'pull_request'
        run: node scripts/check-ledger-coverage.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      # The post-merge half. The step above can only see the current PR's
      # context — nobody asks between PRs, and that interval is where both of
      # the ledger's real misses (#286, #290) actually happened. Rows ship via
      # dedicated [LEDGER] PRs (working-modes.md), so this fails `main` when a
      # merged [LEDGER] carrier skipped a row it owed, or when the no-carrier
      # backstop trips (2+ merges since a loop closed, row still missing, no
      # [LEDGER] PR open). Pending-but-not-yet-due rows are printed, not failed.
      - name: Audit loop-ledger debt
        if: github.event_name == 'push'
        run: node scripts/check-ledger-coverage.mjs --audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The client and server each keep their own copy of the redirect-target
      # validator (no shared workspace boundary between them) — PR #292 found
      # the same normalization defect in both at once. This is the mechanical
      # guard against a future fix landing on only one copy.
      - name: Check return-to validator parity
        run: pnpm run check:return-to-parity

      - name: Validate migration snapshots
        run: pnpm --filter @workspace/db validate-snapshots

      # Guard against hand-edits to codegen-owned files (known-failure-patterns.md
      # → "Manual api-zod/src/index.ts export silently reverted by codegen").
      # Same script as the local ritual: rerun codegen, fail on any diff.
      - name: Codegen drift check
        run: pnpm run check:codegen-drift

      - name: Build app
        run: pnpm run build
        env:
          PORT: "8081"
          BASE_PATH: "/__mockup"

  # Authoritative test gate: runs the api-server integration suite against a real
  # Postgres + pgvector. Phase 2's runner does all DB setup; CI just provides the
  # database. Still parallel with `build` — the `changes` gate adds only its own
  # ~seconds of latency, and skipping here reports "Success" to required checks
  # (see the `changes` job's comment for why that's safe).
  test:
    name: Test
    needs: changes
    # `!cancelled() && result != 'success'` (not a bare needs-gate): if the
    # `changes` job fails, plain `needs` would SKIP this job, and a skipped
    # required check reports success — a transient classifier failure would
    # green-light the PR without running any tests. This condition runs the
    # suite whenever classification didn't positively succeed-and-say-skip.
    # `!cancelled()` rather than `always()` so the concurrency group's
    # cancel-in-progress still cancels superseded runs.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run-heavy == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: overhype
          POSTGRES_PASSWORD: overhype
          POSTGRES_DB: overhype_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U overhype -d overhype_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # overhype_test is a name the runner's production guard allows (it refuses
      # `heliumdb`, the prod/dev DB name). The `overhype` role is a superuser
      # (postgres image default), so the runner uses its fast per-worker-DB mode.
      DATABASE_URL: postgres://overhype:overhype@localhost:5432/overhype_test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Node 22 (not 20): the test runner passes a glob (src/__tests__/**/*.test.ts)
      # to `node --test`, which only expands globs on Node 21+. Node 20 finds 0
      # files (and lacks the test-isolation flag). 22 matches where these tests
      # are verified to run (Replit is on Node 24).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pg_dump/psql must be >= the pg16 server the runner clones schemas from.
      # Put the v16 bin dir first on PATH so they resolve to v16 even if an older
      # client also exists on the runner.
      - name: Install PostgreSQL client 16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/psql --version
          /usr/lib/postgresql/16/bin/pg_dump --version

      # Fail early and clearly if the service/credentials are wrong, and create the
      # pgvector extension before push-force (the schema has vector columns).
      - name: Prepare database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'SELECT current_database(), current_user;'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT extname FROM pg_extension WHERE extname = 'vector';"

      - name: Show runner diagnostics
        run: |
          echo "nproc=$(nproc)"
          node --version
          pnpm --version

      # `pretest` applies push-force + migrations + codegen; run-tests-sharded.sh
      # then clones an isolated database per shard (auto-selected min(nproc,4)).
      - name: Run api-server test suite
        run: pnpm --filter @workspace/api-server test

  # Frontend unit suite (vitest, jsdom — no server or DB needed). Runs in
  # parallel with build/test for fast feedback. Before this job existed, only
  # the backend suite gated PRs and a frontend regression rode through green CI.
  frontend-test:
    name: Frontend Test
    needs: changes
    # `!cancelled() && result != 'success'` (not a bare needs-gate): if the
    # `changes` job fails, plain `needs` would SKIP this job, and a skipped
    # required check reports success — a transient classifier failure would
    # green-light the PR without running any tests. This condition runs the
    # suite whenever classification didn't positively succeed-and-say-skip.
    # `!cancelled()` rather than `always()` so the concurrency group's
    # cancel-in-progress still cancels superseded runs.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run-heavy == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run overhype-me vitest suite
        run: pnpm --filter @workspace/overhype-me test

  # Route-load smoke (Playwright) — the regression net for the crash/reload-loop
  # bug class (known-failure-patterns.md → "Self-retriggering recovery with no
  # bounded exit"). Boots the REAL dev stack — api-server + Vite dev server —
  # because the bug class lives in dev-server/lazy-chunk behavior that neither
  # unit tests nor a production build exercise. Outside Replit there is no
  # platform path-router splitting /api from the SPA, so the Vite config's
  # env-gated E2E_API_PROXY_TARGET proxy plays that role here.
  e2e-smoke:
    name: E2E Smoke
    needs: changes
    # `!cancelled() && result != 'success'` (not a bare needs-gate): if the
    # `changes` job fails, plain `needs` would SKIP this job, and a skipped
    # required check reports success — a transient classifier failure would
    # green-light the PR without running any tests. This condition runs the
    # suite whenever classification didn't positively succeed-and-say-skip.
    # `!cancelled()` rather than `always()` so the concurrency group's
    # cancel-in-progress still cancels superseded runs.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run-heavy == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: overhype
          POSTGRES_PASSWORD: overhype
          POSTGRES_DB: overhype_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U overhype -d overhype_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://overhype:overhype@localhost:5432/overhype_test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ~170MB Chromium download — cache it like setup-node caches the pnpm
      # store. On a hit the install step is skipped entirely (the ubuntu-24.04
      # image already ships the browser's shared-library deps; --with-deps
      # below only matters on the cache-miss path).
      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @workspace/overhype-me exec playwright install --with-deps chromium

      - name: Apply schema + migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          pnpm --filter @workspace/db push-force
          pnpm --filter @workspace/db run migrate

      # The smoke spec authenticates via POST /api/auth/dev-admin-login, which
      # looks up the bootstrap admin account. The seed script imports the
      # canonical BOOTSTRAP_ADMIN_EMAIL so CI can't drift from the route.
      - name: Seed admin user
        run: pnpm --filter @workspace/api-server exec tsx scripts/seed-dev-admin.ts

      # Real dev entrypoints, minus the supervisor wrapper (a crash should fail
      # CI, not restart). Both servers boot concurrently; the health polls run
      # after both launches so total wait is max(boot times), not the sum.
      # ENABLE_DEV_ADMIN_LOGIN is safe here for the same reason as dev-run.sh:
      # isDevAdminLoginEnabled() is fail-closed and this is an ephemeral CI
      # database. Vite's /api proxy defaults to localhost:8080 off-Replit
      # (vite.config.ts), standing in for Replit's path router.
      - name: Start dev stack (api-server + Vite)
        run: |
          (cd artifacts/api-server && PORT=8080 NODE_ENV=development ENABLE_DEV_ADMIN_LOGIN=true CRON_SECRET=ci-smoke-dummy \
            pnpm exec tsx src/index.ts > /tmp/api-server.log 2>&1 &)
          (cd artifacts/overhype-me && PORT=5173 BASE_PATH=/ \
            pnpm exec vite > /tmp/vite.log 2>&1 &)
          wait_for_url() {
            timeout 90 bash -c "until curl -sf $1 > /dev/null; do sleep 2; done" \
              || { echo "::error::$2 never became healthy"; tail -50 "$3"; exit 1; }
          }
          wait_for_url http://localhost:8080/api/config api-server /tmp/api-server.log
          wait_for_url http://localhost:5173/ "Vite-dev-server" /tmp/vite.log

      - name: Run route-load smoke suite
        run: E2E_BASE_URL=http://localhost:5173 pnpm --filter @workspace/overhype-me run e2e:smoke

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-traces
          path: |
            artifacts/overhype-me/test-results/
            /tmp/api-server.log
            /tmp/vite.log
          retention-days: 7
          if-no-files-found: ignore
