name: Acceptance

# The on-demand acceptance run (Launch Phase 2, increment 6, #631; plan
# docs/plans/PLAN_PHASE2_INC6_ACCEPTANCE.md). Never a required check: its job
# names are none of the required checks in .agents/machinery.json, and no
# ruleset names them. It holds no credential and references no secret.
#
# `workflow_dispatch` fires only for a workflow file on the default branch;
# `pull_request`, limited to the acceptance tooling's own paths, lets a change
# to that tooling prove itself here before it merges.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/acceptance.yml
      - artifacts/api-server/scripts/acceptance-run.ts
      - artifacts/api-server/src/testing/acceptance/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The detector's feasibility on this runner (plan step 1): the namespace is
  # built, both observers record the four self-test attempts, the database is
  # reached through the relay, and a caught vendor request turns the run red.
  probe:
    name: Acceptance detector probe
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: overhype
          POSTGRES_PASSWORD: overhype
          POSTGRES_DB: overhype_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U overhype -d overhype_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://overhype:overhype@localhost:5432/overhype_test
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the detector's tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q strace iproute2 iptables postgresql-client-16
          echo "apparmor_restrict_unprivileged_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)"
          echo "ipv6 present: $([ -d /proc/sys/net/ipv6 ] && echo yes || echo no)"

      - name: Mark the test database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER DATABASE overhype_test SET overhype.test_database = 'yes';"

      - name: Probe — must be green
        working-directory: artifacts/api-server
        run: pnpm exec tsx scripts/acceptance-run.ts --mode probe

      - name: Probe with a caught vendor request — must be red
        working-directory: artifacts/api-server
        run: |
          set +e
          pnpm exec tsx scripts/acceptance-run.ts --mode probe --control forbidden-request > control.json
          code=$?
          cat control.json
          if [ "$code" -ne 1 ]; then echo "::error::the control exited $code; a caught vendor request must make the run red (exit 1)"; exit 1; fi
