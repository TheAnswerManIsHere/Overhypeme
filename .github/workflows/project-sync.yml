name: Project sync

# Mirrors an issue's workstream labels (stage:* / waiting:* / mode:*) into the
# Projects v2 board's Status, Waiting on, and Mode fields. Labels are the only
# part of this an agent can write, so they are the source of truth and the
# board is the projection.
#
# Runs on label changes rather than a schedule: the board should be correct the
# moment a workstream moves, and a polling loop would burn Actions minutes to
# discover nothing most of the time.

on:
  issues:
    types: [opened, reopened, labeled, unlabeled]
  # Manual full-board reconcile. Use after adding a Status option, changing a
  # label convention, or any stretch where the sync may have missed events.
  workflow_dispatch:

# One shared group across every trigger, not per issue, with a real FIFO
# queue rather than the default single pending slot. `labeled`/`unlabeled`
# fire as separate events when labels are swapped, and a manual
# workflow_dispatch reconcile touches every open issue — with the default
# `queue: single`, a run queued behind an in-progress one is only a *pending
# candidate*: a second event arriving before the first starts replaces it
# outright, so issue #1's sync could be dropped in favor of #2's and never
# run at all (not just delayed). `queue: max` keeps every queued run instead
# of collapsing to the newest. Full serialization is cheap here (these are
# lightweight GraphQL calls, not long builds), so correctness wins over
# throughput.
concurrency:
  group: project-sync
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    name: Sync labels to project fields
    runs-on: ubuntu-latest

    # Explicit least-privilege. GITHUB_TOKEN reads issues only; it cannot reach
    # Projects v2 at all, which is why PROJECTS_TOKEN exists separately.
    permissions:
      contents: read
      issues: read

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync labels to project fields
        env:
          # Classic PAT, `project` scope. A fine-grained token cannot reach a
          # user-owned project — GitHub exposes no account-level Projects
          # permission for them.
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: "1"
          # Absent on workflow_dispatch, which reconciles every open issue.
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/sync-project-fields.mjs
