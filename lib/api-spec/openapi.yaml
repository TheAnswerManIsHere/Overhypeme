    MySubmission:
      type: object
      description: >
        One submission. `kind` says which fields apply: "review" (a fact under
        review or declined), "fact" (an approved, live fact, in `fact`),
        "fact_gone" (an approved fact since taken down) or "comment".
      required: [kind, id, text, hashtags, createdAt]
      properties:
        kind:
          type: string
          enum: [review, fact, fact_gone, comment]
        id:
          type: integer
        text:
          type: string
        hashtags:
          type: array
          items:
            type: string
        createdAt:
          type: string
        decidedAt:
          type: string
          nullable: true
          description: When it was approved or declined.
        progress:
          type: string
          nullable: true
          enum: [first_look, preparing, null]
          description: How far a fact under review has got; null otherwise.
        reason:
          type: string
          nullable: true
          description: The decline reason code; set only on a declined fact.
        teamNote:
          type: string
          nullable: true
          description: The team's note; set only on a declined fact or comment.
        fact:
          allOf:
            - $ref: "#/components/schemas/FactSummary"
          nullable: true
          description: The live fact, for kind "fact".
        factId:
          type: integer
          nullable: true
          description: The fact a comment is on.
        factText:
          type: string
          nullable: true
          description: The wording of the fact a comment is on.
        factLive:
          type: boolean
          nullable: true
          description: Whether the fact a comment is on is live.
        hidden:
          type: boolean
          nullable: true
          description: An approved comment hidden while it is looked at again.

