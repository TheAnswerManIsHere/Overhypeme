openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for Overhype.me
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: facts
    description: Overhype.me facts operations
  - name: hashtags
    description: Hashtag operations
  - name: ratings
    description: Fact rating operations
  - name: reactions
    description: Heart reactions on memes and comments
  - name: comments
    description: Comment operations
  - name: users
    description: User profile operations
  - name: memes
    description: Meme generator and permalink operations
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'

  /entitlements/version:
    get:
      tags: [Auth]
      operationId: getEntitlementVersion
      summary: Cheap revalidation probe for the client's entitlement snapshot
      description: |
        Returns the pair the client polls to decide whether to re-fetch its
        entitlements. "Cheap" means a small response and no grid query beyond
        the already-loaded revision — NOT proxy-cacheable.

        This response is per-principal and must never be shared-cached. It
        varies by tier, admin grant, and session-scoped view-as-user state, so a
        proxy caching it by URL could serve one principal's fingerprint to
        another — and the second client, seeing a fingerprint it does not
        recognise as its own change, may never converge.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: The current grid revision and the caller's principal fingerprint.
          headers:
            Cache-Control:
              schema:
                type: string
                example: 'private, no-store'
            Vary:
              schema:
                type: string
                example: 'Cookie, Authorization'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementVersion'

  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.

  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the returnTo path on success.

  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.

  /facts:
    get:
      operationId: listFacts
      tags: [facts]
      summary: List facts
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: hashtag
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [top, newest, trending]
            default: top
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: List of facts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactListResponse"
    # POST /facts (admin direct-create) was removed in the Phase 2 fact-lifecycle
    # closure — every fact now enters through the moderation funnel. No post: here.

  /facts/hero:
    get:
      operationId: getHeroFact
      tags: [facts]
      summary: Weighted-random hero fact (top ~50 Wilson-ranked, with optional exclusions)
      parameters:
        - name: exclude
          in: query
          required: false
          description: Comma-separated list of fact IDs to exclude from selection.
          schema:
            type: string
      responses:
        "200":
          description: A weighted-random hero fact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeroFactResponse"
        "404":
          description: No facts available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /facts/{factId}:
    get:
      operationId: getFact
      tags: [facts]
      summary: Get a single fact with details
      parameters:
        - name: factId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Fact detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /facts/{factId}/related:
    get:
      operationId: listRelatedFacts
      tags: [facts]
      summary: List facts similar to the given fact
      description: |
        Returns facts that share hashtags with the given fact, scored by
        tag-overlap count, broken by Wilson score descending. The given
        fact is excluded. If the
        given fact has no hashtags or there are not enough overlapping
        candidates, the response is padded with top-Wilson-score facts.
      parameters:
        - name: factId
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 6
      responses:
        "200":
          description: Related facts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelatedFactsResponse"
        "404":
          description: Source fact not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /facts/{factId}/share:
    post:
      operationId: recordFactShare
      tags: [facts]
      summary: Record a share event for a fact and return the new shareCount
      description: |
        Increments the fact's shareCount counter. Called by the client
        whenever a user opens a native share sheet, copies the link, or
        otherwise indicates they shared the fact's URL. Rate-limited per
        IP+userId.
      parameters:
        - name: factId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated share count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordFactShareResponse"
        "404":
          description: Fact not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate-limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /facts/{factId}/rating:
    post:
      operationId: rateFact
      tags: [ratings]
      summary: Rate a fact (upvote or downvote)
      parameters:
        - name: factId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateFactRequest"
      responses:
        "200":
          description: Rating updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /facts/{factId}/comments:
    get:
      operationId: listComments
      tags: [comments]
      summary: List comments for a fact
      parameters:
        - name: factId
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [top, new]
            default: top
          description: |
            Result ordering. `top` (default) ranks by heart count, then
            createdAt as tiebreak. `new` orders strictly by createdAt
            descending.
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentListResponse"
    post:
      operationId: addComment
      tags: [comments]
      summary: Add a comment to a fact
      parameters:
        - name: factId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCommentRequest"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /comments/{id}/heart:
    post:
      operationId: heartComment
      tags: [reactions]
      summary: Toggle a heart reaction on a comment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated heart count and viewer state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /memes/{id}/heart:
    post:
      operationId: heartMeme
      tags: [reactions]
      summary: Toggle a heart reaction on a meme
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated heart count and viewer state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Meme not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /hashtags:
    get:
      operationId: listHashtags
      tags: [hashtags]
      summary: List all hashtags with fact counts
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of hashtags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HashtagListResponse"

  /users/me:
    get:
      operationId: getMyProfile
      tags: [users]
      summary: Get the current user's profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateMyProfile
      tags: [users]
      summary: Update the current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateProfileResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Conflict (username or email already taken)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /users/me/notifications:
    patch:
      operationId: updateMyNotifications
      tags: [users]
      summary: Update the current admin's notification preferences (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationsRequest"
      responses:
        "200":
          description: Notification preferences updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateNotificationsResponse"
        "400":
          description: No valid fields to update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden (not an admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /users/me/search-history:
    post:
      operationId: recordSearch
      tags: [users]
      summary: Record a search query to history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordSearchRequest"
      responses:
        "204":
          description: Search recorded

  /users/me/submissions/counts:
    get:
      operationId: getMySubmissionCounts
      tags: [users]
      summary: How many of the current user's submissions are in each status, and how many match a search
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: The counts per type and status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MySubmissionCounts"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /users/me/submissions:
    get:
      operationId: listMySubmissions
      tags: [users]
      summary: One page of the current user's submissions of one type in one status
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [facts, comments]
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [review, live, declined, gone]
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [newest, oldest]
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: One page of submissions and where the next starts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MySubmissionPage"
        "400":
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /ai/check-duplicate:
    post:
      operationId: checkDuplicate
      tags: [facts]
      summary: Check if a fact text is a duplicate (requires auth)
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 10
                  maxLength: 1000
      responses:
        "200":
          description: Duplicate check result
          content:
            application/json:
              schema:
                type: object
                required: [outcome, isDuplicate, confidence]
                properties:
                  outcome:
                    type: string
                    enum: [duplicate, distinct, unavailable]
                    description: >-
                      The verdict. "unavailable" means the check could not run
                      (search or AI failure, or a malformed AI answer); it is
                      never reported as "distinct".
                  isDuplicate:
                    type: boolean
                    description: outcome == "duplicate"; kept for older clients.
                  confidence:
                    type: integer
                    minimum: 0
                    maximum: 100
                    description: >-
                      Cosine similarity of the matched (or nearest) fact, as a
                      percentage. A detail, not a likelihood; no screen shows it.
                  matchingFactId:
                    type: integer
                    nullable: true
                  matchingFactText:
                    type: string
                    nullable: true
                  matchingCanonicalText:
                    type: string
                    nullable: true
                  matchingReviewId:
                    type: integer
                    nullable: true
                    description: The other pending review an exact match found.
        "401":
          description: Authentication required
        "429":
          description: Rate limit exceeded

  /admin/comments/flagged:
    get:
      operationId: getAdminFlaggedComments
      tags: [comments]
      summary: List AI-flagged comments (admin only)
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Flagged comments list
          content:
            application/json:
              schema:
                type: object
                required: [comments]
                properties:
                  comments:
                    type: array
                    items:
                      type: object
                      required: [id, factId, text, createdAt]
                      properties:
                        id:
                          type: integer
                        factId:
                          type: integer
                        text:
                          type: string
                        authorId:
                          type: string
                          nullable: true
                        flagReason:
                          type: string
                          nullable: true
                        createdAt:
                          type: string
                          format: date-time
        "401":
          description: Authentication required
        "403":
          description: Forbidden

  /admin/comments/{id}/approve:
    post:
      operationId: approveAdminComment
      tags: [comments]
      summary: Approve (unflag) a flagged comment (admin only)
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Comment approved
        "401":
          description: Authentication required
        "403":
          description: Forbidden

  /admin/comments/{id}:
    delete:
      operationId: deleteAdminComment
      tags: [comments]
      summary: Delete a flagged comment (admin only)
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Comment deleted
        "401":
          description: Authentication required
        "403":
          description: Forbidden

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /memes:
    post:
      operationId: createMeme
      tags: [memes]
      summary: Create a meme from a fact and a background image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemeRequest"
      responses:
        "201":
          description: Meme created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemeRecord"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /memes/{slug}:
    get:
      operationId: getMemeBySlug
      tags: [memes]
      summary: Get a meme by its permalink slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Meme detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemeDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /facts/{factId}/memes:
    get:
      operationId: listFactMemes
      tags: [memes]
      summary: List memes generated for a specific fact
      parameters:
        - name: factId
          in: path
          required: true
          schema:
            type: integer
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [top, new]
            default: top
          description: |
            Result ordering. `top` (default) ranks by heart count, then
            createdAt as tiebreak. `new` orders strictly by createdAt
            descending.
      responses:
        "200":
          description: List of memes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemeListResponse"

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: sid
      description: Browser session cookie (set by the login flow).

  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Bearer session token (used by mobile clients).
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Session cookie (used by browser clients).
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthUser:
      type: object
      required: [id]
      properties:
        id:
          type: string
        email:
          type: string
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        profileImageUrl:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        membershipTier:
          type: string
          enum: [unregistered, registered, legendary]
          nullable: true
        isAdmin:
          type: boolean
          nullable: true
        isRealAdmin:
          type: boolean
          nullable: true
        pronouns:
          type: string
          nullable: true
        userRole:
          type: string
          enum: [unregistered, registered, legendary, admin]
          nullable: true
        realUserRole:
          type: string
          enum: [unregistered, registered, legendary, admin]
          nullable: true
        eligibility:
          type: string
          description: >-
            Whether the account may act, or the first reason it may not (launch
            Phase 5): verify the email, then onboard, then act. A signed-in
            request that writes while this is not `eligible` is refused with the
            matching code. `underage` (launch Phase 14): the account can only
            sign out or ask for deletion, and its other reads run signed out.
            `terms_unaccepted`: it can read but must accept the current Terms
            and Privacy page before it acts.
          enum: [eligible, suspended, underage, deletion_pending, unverified, unonboarded, terms_unaccepted]
          nullable: true
        emailVerified:
          type: boolean
          nullable: true
        onboardingCompleted:
          type: boolean
          nullable: true
        is18Plus:
          type: boolean
          description: Derived from the stored date of birth at read time; never stored. Photo uploads require it.
          nullable: true

    Entitlement:
      type: object
      required: [allowed, limit]
      properties:
        allowed:
          type: boolean
        limit:
          # Always null in Plan 1a — every feature is boolean. Typed from the
          # start because a boolean feature is the degenerate case of a metered
          # one, so Plan 2 extends a working shape rather than migrating one,
          # with no client-side breaking change when metered rows arrive.
          type: integer
          nullable: true

    EntitlementVersion:
      type: object
      required: [gridRevision, principalFingerprint]
      properties:
        gridRevision:
          # Advances on every grid cell write, in the same transaction. Plain
          # `integer` (no int64 format): the DB column is bigint, but
          # featureAccess.ts already coerces it with Number(...) before it
          # ever reaches JSON, and the React client / runtime Zod validator /
          # use-auth.ts all treat it as a number — int64 made orval emit
          # `bigint` in the generated api-zod contract alone, a type no
          # consumer or the real payload could produce. Round 3 of PR #425's
          # review caught this.
          type: integer
        principalFingerprint:
          # Moves when the PRINCIPAL changes though the grid does not — a
          # lapsing entitlement, an admin grant/revoke, a view-as-user toggle.
          # A grid-only revision can never tell an open client its own tier
          # changed.
          type: string

    AuthUserEnvelope:
      type: object
      required: [user, entitlements, entitlementVersion]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
        entitlements:
          # A SIBLING of user, not nested inside it. /auth/user returns
          # {user: null} when logged out, so entitlements hanging off AuthUser
          # would leave every anonymous surface deriving or hardcoding, and any
          # future `unregistered` grant would be unreachable.
          #
          # A typed map rather than a bare string[]: an array can only say
          # "allowed" and cannot express Plan 2's limit.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Entitlement'
        entitlementVersion:
          # Carries BOTH halves, read from the same resolution as the payload.
          # Stamping with gridRevision alone leaves a real race: if the
          # principal changes A → B during the fetch and back to A before the
          # next poll, the pair looks unchanged and the client keeps
          # entitlements computed for the transient principal indefinitely.
          $ref: '#/components/schemas/EntitlementVersion'

