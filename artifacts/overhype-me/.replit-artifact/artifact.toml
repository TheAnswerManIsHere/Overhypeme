kind = "web"
previewPath = "/"
title = "Overhype Me"
version = "1.0.0"
id = "artifacts/chuck-norris-facts"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26169

[services.development]
run = "pnpm --filter @workspace/overhype-me run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/overhype-me", "run", "build" ]

# Served by our own process, not Replit's static service, so the published
# app's files can be refused when a request did not come through Cloudflare
# (launch Phase 14, increment 3; server/serve.mjs). It answers as the static
# service did: files as themselves, every other address with index.html.
[services.production.run]
args = [ "node", "artifacts/overhype-me/server/serve.mjs" ]

[services.production.run.env]
PORT = "26169"
NODE_ENV = "production"

[services.env]
PORT = "26169"
BASE_PATH = "/"
